<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo · film (picture edit)</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../../shared/lens.css">
<style>
  /* ---------- player ---------- */
  html, body { width: 100%; height: 100%; margin: 0; background: #010307; overflow: hidden; }
  #viewport { position: fixed; inset: 0 0 64px 0; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #000; }
  #controls { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 0 16px; box-sizing: border-box; background: #0a0f17; border-top: 1px solid #ffffff14; color: #dbe7f5; font: 500 14px/1 system-ui, sans-serif; transition: opacity 0.3s; }
  #controls button { min-width: 44px; height: 40px; padding: 0 12px; border: 1px solid #ffffff22; border-radius: 10px; background: #121a26; color: inherit; font: inherit; cursor: pointer; }
  #controls button:hover { background: #1a2433; }
  #controls button:focus-visible { outline: 2px solid #3d9dfc; outline-offset: 2px; }
  .scrub { position: relative; flex: 1; height: 40px; display: flex; align-items: center; }
  .scrub input { width: 100%; margin: 0; accent-color: #3d9dfc; cursor: pointer; }
  .ticks { position: absolute; left: 0; right: 0; top: 0; height: 12px; pointer-events: none; }
  .ticks b { position: absolute; top: 0; width: 2px; height: 10px; background: #9ddcff66; }
  .ticks span { position: absolute; top: -2px; font-size: 10px; color: #8ea3bb; white-space: nowrap; transform: translateX(4px); }
  #time { min-width: 130px; text-align: right; font-variant-numeric: tabular-nums; }
  #scene { min-width: 220px; color: #8ea3bb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 1100px) { .ticks span, #scene { display: none; } }
  body.clean #controls, body.idle #controls { opacity: 0; pointer-events: none; }
  body.clean #viewport, body.fs #viewport { bottom: 0; }
  body.render #controls { display: none; }
  body.render #viewport { bottom: 0; }

  /* ---------- film ---------- */
  .abs { position: absolute; }
  .scene { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
  .bbox svg, .ripple svg { display: block; }
  .ripple { pointer-events: none; }
  .kt .headline { text-shadow: 0 6px 40px rgba(0, 0, 0, 0.45); }
  .mi { display: inline-flex; width: 1.05em; height: 1.05em; flex: none; }
  .mi svg { width: 100%; height: 100%; }

  .s-open { background: radial-gradient(ellipse at 76% 68%, #2c1d11 0%, #0b1220 46%, #04080f 100%); }
  .s-footage { background: radial-gradient(ellipse at 50% 55%, #2a1c11 0%, #0b0e14 55%, #04060a 100%); }
  .s-how { background: radial-gradient(ellipse at 50% 38%, rgba(118, 96, 255, 0.16), transparent 58%), var(--stage-bg-image), #06162c; }
  .s-trust { background: radial-gradient(ellipse at 36% 58%, #241810 0%, #0a0f17 60%, #05080d 100%); }
  .s-end { background: radial-gradient(ellipse at 72% 50%, #3b2513 0%, #0d121b 55%, #05080d 100%); }

  .shade-left { pointer-events: none; background: linear-gradient(90deg, rgba(4, 8, 14, 0.9) 0%, rgba(4, 8, 14, 0.6) 38%, transparent 60%), linear-gradient(0deg, rgba(4, 8, 14, 0.75), transparent 46%); }
  .dim { background: #03060b; opacity: 0; pointer-events: none; }
  .phone { height: 450px; box-sizing: border-box; padding: 16px; border-radius: 46px; background: linear-gradient(145deg, #1f2733, #07090c); box-shadow: 0 50px 90px #000c, inset 0 0 0 2px #2c3645; transform: rotate(-3deg); }
  .phone-screen { position: relative; width: 100%; height: 100%; border-radius: 30px; overflow: hidden; background: #000; }
  .ph-board { position: absolute; left: 47px; top: 0; width: 653px; height: 418px; }
  .ph-board svg { display: block; }
  .ph-chip { position: absolute; left: 18px; top: 16px; padding: 7px 14px; border-radius: 999px; background: #000b; color: #fff; font-size: 18px; font-weight: 700; }
  .ph-step { position: absolute; left: 20px; bottom: 40px; color: #fff; font-size: 24px; font-weight: 700; text-shadow: 0 2px 10px #000; }
  .ph-bar { position: absolute; left: 20px; right: 20px; bottom: 20px; height: 6px; border-radius: 3px; background: #ffffff33; }
  .ph-bar i { display: block; height: 100%; border-radius: 3px; background: #ff5050; }
  .ph-glare { position: absolute; inset: 0; background: linear-gradient(120deg, rgba(255, 255, 255, 0.13), transparent 34%); pointer-events: none; }
  .tagchip { width: auto !important; padding: 10px 18px; border-radius: 999px; background: rgba(4, 15, 29, 0.78); border: 1px solid var(--line); color: #e9f4ff; font-size: 22px; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap; }

  .lockup { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; text-align: center; height: 1080px; }
  .lock-row { display: flex; align-items: center; gap: 40px; }
  .lock-mark { width: 200px; height: 200px; }
  .lock-mark svg { width: 100%; height: 100%; }
  .echo-word { font-size: 220px; font-weight: 500; letter-spacing: -0.055em; line-height: 1; color: #fff; padding-bottom: 0.08em; }
  .lock-tag { margin: 0; font-size: 64px; font-weight: 500; letter-spacing: -0.045em; }
  .lock-sub { margin: 0; color: var(--text-dim); font-size: 30px; }
  .lock-meta { display: flex; gap: 24px; color: var(--text-dim); font-size: 28px; margin-top: 24px; }
  .lock-meta span { padding: 12px 22px; border: 1px solid var(--line); border-radius: 999px; background: #040f1d99; }
  .lock-meta b { margin-right: 12px; color: var(--eyebrow); font-size: 18px; letter-spacing: 0.16em; text-transform: uppercase; }
  .lock-built { margin: 0; color: var(--text-faint); font-size: 24px; }

  /* footage */
  .f-head { display: flex; align-items: center; gap: 16px; }
  .mini-mark { width: 40px; height: 40px; }
  .mini-mark svg { width: 100%; height: 100%; }
  .f-label { display: flex; justify-content: flex-end; }
  .lab { white-space: nowrap; padding: 12px 20px; border-radius: 999px; font-size: 19px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
  .lab.prev { border: 2px dashed #ffb020aa; color: #ffd58a; background: #1a1206d9; }
  .lab.real { border: 1px solid #34d27b88; color: #b7f3d1; background: #06140ed9; }
  .fframe { height: 880px; border-radius: 36px; overflow: hidden; background: #120d09; box-shadow: 0 50px 100px #000d, inset 0 0 0 2px #ffffff26; }
  .f-prev, .f-vid { position: absolute; inset: 0; }
  .f-prev::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 52%, rgba(0, 0, 0, 0.6)); pointer-events: none; }
  .f-vid video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: none; }
  .f-rec { position: absolute; left: 24px; top: 22px; padding: 8px 14px; border-radius: 999px; background: #000c; color: #ff5a5a; font-size: 22px; font-weight: 800; }
  .f-rec span { margin-left: 6px; color: #fff; font-variant-numeric: tabular-nums; }
  .f-toast { position: absolute; left: 70px; width: 355px; bottom: 110px; display: flex; gap: 12px; align-items: center; justify-content: center; padding: 14px 18px; border-radius: 18px; background: #000d; color: #fff; font-size: 26px; font-weight: 700; }
  .f-badge { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 18px; background: repeating-linear-gradient(-45deg, #1c1306 0 14px, #251908 14px 28px); color: #ffd58a; font-size: 16px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; text-align: center; }
  .f-num { margin-bottom: 18px; color: #9ddcff; font-size: 30px; font-weight: 700; letter-spacing: 0.1em; }
  .f-num i { font-style: normal; color: var(--text-faint); }
  .f-sub { color: var(--text-dim); font-size: 36px; line-height: 1.35; }
  .f-small { color: var(--text-faint); font-size: 24px; letter-spacing: 0.02em; }
  .mlens { padding: 28px 32px; border-radius: 28px; background: #000; border: 1px solid #ffffff22; box-shadow: 0 30px 60px #000b; color: #fff; }
  .mlens-t { display: flex; align-items: center; gap: 16px; font-size: 40px; font-weight: 800; }
  .mlens-l { margin-top: 10px; color: #c9d3da; font-size: 32px; font-weight: 600; }
  .speech { display: flex; gap: 18px; align-items: flex-start; padding: 22px 28px; border-radius: 24px; background: #1a1206e8; border: 1px solid #ffb02066; color: #fff; font-size: 34px; font-weight: 600; line-height: 1.3; box-sizing: border-box; }
  .speech .mi { margin-top: 4px; color: #ffb020; }
  .bubble { display: flex; gap: 16px; align-items: flex-start; padding: 24px 30px; border-radius: 30px; font-size: 40px; font-weight: 600; line-height: 1.25; box-sizing: border-box; }
  .bubble.q { width: auto !important; background: #f3f7fb; color: #0b1220; border-bottom-left-radius: 8px; }
  .bubble.a { background: linear-gradient(135deg, #1d6fe0, #2b8fff); color: #fff; border-bottom-right-radius: 8px; }
  .bubble.big { font-size: 54px; }
  .srcchip { color: #b9d4f2; }

  /* how */
  .eyebrow-abs.center .eyebrow { justify-content: center; }
  .strip { background: #0d0a08; box-shadow: 0 30px 80px #000a, inset 0 0 0 1px #ffffff12; }
  .strip::before, .strip::after { content: ""; position: absolute; left: 0; right: 0; height: 14px; background: repeating-linear-gradient(90deg, #f3e9d833 0 20px, transparent 20px 46px); }
  .strip::before { top: 11px; }
  .strip::after { bottom: 11px; }
  .reel-frame { height: 256px; border-radius: 10px; overflow: hidden; background: #17120d; }
  .reel-frame svg { display: block; }
  .beam { border-radius: 8px; background: linear-gradient(180deg, transparent, #9ddcff 18%, #8b7bff 82%, transparent); }
  .beam-chip { display: flex; gap: 10px; align-items: center; justify-content: center; padding: 10px 18px; border-radius: 999px; background: #0b0f1fd9; border: 1px solid #8b7bff99; color: #e6e2ff; font-size: 24px; font-weight: 700; box-sizing: border-box; }
  .beam-chip .mi { color: #b9adff; }
  .step-card { height: 128px; box-sizing: border-box; padding: 22px 24px; border-radius: 20px; background: linear-gradient(130deg, #e0efff15, #a7d5ff08); border: 1px solid var(--line); }
  .step-card i { display: block; color: var(--eyebrow); font-size: 18px; font-style: normal; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .step-card b { display: block; margin-top: 10px; font-size: 34px; font-weight: 600; }
  .step-card.hot { border-color: #9ddcff; box-shadow: 0 0 40px #3d9dfc66; }
  .scanline { border-radius: 3px; background: #c9ecff; box-shadow: 0 0 30px #9ddcff, 0 0 90px #3d9dfc; }
  .crow { display: flex; align-items: center; gap: 18px; padding: 18px 0; border-bottom: 1px solid #ffffff14; font-size: 34px; font-weight: 600; }
  .crow .ci { width: 40px; height: 40px; flex: none; }
  .crow .ci svg { width: 100%; height: 100%; }
  .crow .cs { margin-left: auto; font-size: 22px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
  .crow.ok .ci, .crow.ok .cs { color: #34d27b; }
  .crow.bad .ci, .crow.bad .cs { color: #ffb020; }
  .vd { display: flex; align-items: center; gap: 18px; padding: 24px 30px; border-radius: 24px; font-size: 38px; font-weight: 600; }
  .vd b { font-size: 26px; font-weight: 800; letter-spacing: 0.16em; }
  .vd .mi { width: 44px; height: 44px; }
  .vd.fix { background: #1f1506; border: 2px solid #ffb020; color: #ffe2a8; }
  .vd.ok { background: #06180f; border: 2px solid #34d27b; color: #c9f7dd; }
  .chip-tag { width: auto !important; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: #040f1dcc; color: var(--echo-mist); font-size: 18px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
  .node { height: 280px; transform-origin: center; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; border-radius: 32px; background: linear-gradient(130deg, #e0efff15, #a7d5ff08); border: 1px solid var(--line); }
  .node .ni { display: flex; justify-content: center; height: 72px; color: #9ddcff; }
  .node .ni svg { height: 100%; width: auto; }
  .node b { font-size: 46px; font-weight: 600; letter-spacing: -0.02em; }
  .node i { color: var(--text-dim); font-size: 26px; font-style: normal; }
  .arrow { border-radius: 3px; background: linear-gradient(90deg, #9ddcff, #8b7bff); transform-origin: left center; }
  .pill { padding: 16px 22px; box-sizing: border-box; border-radius: 999px; background: #0b0f1fd9; border: 1px solid #8b7bff88; color: #e6e2ff; font-size: 24px; font-weight: 600; text-align: center; }

  /* revision 2: glasses, wearer's view, hero comparison, ending */
  .glasses img { display: block; width: 1774px; height: 887px; }
  .sweep-wrap { position: absolute; inset: 0; overflow: hidden; -webkit-mask-image: url("../../assets/smart-glasses.png"); mask-image: url("../../assets/smart-glasses.png"); -webkit-mask-size: 1774px 887px; mask-size: 1774px 887px; mix-blend-mode: screen; pointer-events: none; }
  .sweep { position: absolute; top: -10%; left: 0; width: 460px; height: 120%; background: linear-gradient(90deg, transparent, rgba(200, 230, 255, 0.55), transparent); }
  .pov { overflow: hidden; background: #07090c; }
  .pov-tilt { transform-origin: 50% 62%; }
  .pov-vig { pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 42%, rgba(0, 0, 0, 0.7) 100%); }
  .pov-shade { pointer-events: none; background: linear-gradient(0deg, rgba(3, 5, 9, 0.9) 0%, rgba(3, 5, 9, 0.45) 36%, transparent 58%); }
  .pip { height: 300px; border-radius: 22px; overflow: hidden; background: #000; box-shadow: 0 30px 70px #000c, inset 0 0 0 2px #ffffff26; }
  .pip-in { position: absolute; left: 0; top: 0; width: 470px; height: 300px; }
  .pip-in svg { display: block; }
  .mlens.pop { transform: scale(1.04); }
  .lock-inline .li-row { display: flex; align-items: center; gap: 26px; }
  .li-mark { width: 116px; height: 116px; }
  .li-mark svg { width: 100%; height: 100%; }
  .lock-inline .echo-word { font-size: 150px; }
  .li-tag { margin: 8px 0 0; color: var(--text-dim); font-size: 44px; font-weight: 500; letter-spacing: -0.03em; }
  .cmp-layer { overflow: hidden; }
  .wipe { border-radius: 3px; background: #eef8ff; box-shadow: 0 0 30px #9ddcff, 0 0 90px #3d9dfc; }
  .cmp-tag b { display: block; font-size: 46px; font-weight: 600; letter-spacing: -0.02em; }
  .cmp-tag i { display: block; margin-top: 6px; color: var(--text-dim); font-size: 26px; font-style: normal; }
  .cmp-tag.right { text-align: right; }
  .v-sub { display: flex; align-items: center; gap: 14px; color: #ffd58a; font-size: 40px; font-weight: 600; }
  .v-sub .mi { width: 44px; height: 44px; }
  .v-sub.ok { color: #c9f7dd; }
  .v-pass { display: flex; align-items: center; gap: 26px; color: #34d27b; }
  .v-pass b { font-size: 190px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; }
  .v-pass .mi { width: 150px; height: 150px; }
  .occluder { border-radius: 50%; background: radial-gradient(ellipse at 50% 40%, #6e4c3a 0%, #3a271c 45%, #140d08 72%, transparent 100%); filter: blur(38px); }
  .inlens { overflow: hidden; border-radius: 80px; background: #0b0d10; }
  .inlens svg { display: block; }
  .inlens::after { content: ""; position: absolute; inset: 0; background: linear-gradient(130deg, rgba(255, 255, 255, 0.16), transparent 40%); }
  .lock-side { display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .lock-side .lock-row { gap: 28px; }
  .lock-side .lock-mark { width: 150px; height: 150px; }
  .lock-side .echo-word { font-size: 180px; }
  .lock-side .lock-tag { font-size: 60px; text-align: left; }
  .lock-side .lock-meta { flex-wrap: wrap; margin-top: 10px; gap: 16px; font-size: 26px; }

  .pillnote { width: auto !important; padding: 10px 18px; border-radius: 14px; background: #000c; color: #dfe8f2; }

  /* ---------- final pass: photographic layers ---------- */
  .cover { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
  .s-open .cover:nth-of-type(2) { transform-origin: 36% 52%; } /* hinge macro pulls back toward its hinge */
  .ph { position: absolute; max-width: none; user-select: none; }
  .plate { position: absolute; left: 0; top: 0; width: 1000px; height: 640px; transform-origin: 0 0; }
  .plate .piece { filter: drop-shadow(0 6px 7px rgba(25, 12, 4, 0.4)); }
  .plate .ghost { filter: url(#ghostline); }
  .plate-cue { position: absolute; left: 0; top: 0; width: 1000px; height: 640px; overflow: visible; pointer-events: none; }
  .platebox { overflow: hidden; }
  .through { overflow: hidden; background: #090b0e; }
  .rig { position: absolute; left: 0; top: 0; width: 1774px; height: 887px; transform-origin: 0 0; }
  .rig-frame { position: absolute; left: 0; top: 0; width: 1774px; height: 887px; filter: drop-shadow(0 30px 40px rgba(0, 0, 0, 0.55)); }
  .rig-cue, .rig-glint, .rig-edge { position: absolute; left: 0; top: 0; width: 1774px; height: 887px; overflow: hidden; pointer-events: none; }
  .rig-glint i, .rig-edge i { position: absolute; top: -20%; left: 0; width: 240px; height: 140%; background: linear-gradient(90deg, transparent, rgba(222, 246, 255, 0.45), transparent); opacity: 0; }
  .rig-edge { -webkit-mask-image: url("assets/generated-v1/glasses-front-cutout.png"); mask-image: url("assets/generated-v1/glasses-front-cutout.png"); -webkit-mask-size: 1774px 887px; mask-size: 1774px 887px; mix-blend-mode: screen; }
  .lens-cue { position: absolute; width: 336px; }
  .lens-cue .mlens { padding: 14px 18px; border-radius: 16px; background: rgba(0, 0, 0, 0.6); border: 1px solid #ffffff2a; box-shadow: none; }
  .lens-cue .mlens-t { gap: 10px; font-size: 25px; }
  .lens-cue .mlens-l { margin-top: 4px; font-size: 20px; }
  .lens-cue.big { width: 360px; }
  .lens-cue.big .mlens-t { font-size: 44px; }
  .glint-band { pointer-events: none; mix-blend-mode: screen; background: linear-gradient(90deg, transparent, rgba(210, 235, 255, 0.32), transparent); }
  .phone-prop { height: 700px; transform-origin: 50% 50%; }
  .phone-screen-in { overflow: hidden; border-radius: 26px; background: #000; }
  .ps-plate { position: absolute; inset: 0; }
  .ps-chip { position: absolute; left: 12px; top: 12px; padding: 5px 10px; border-radius: 999px; background: #000b; font-size: 15px; font-weight: 700; }
  .ps-step { position: absolute; left: 12px; bottom: 30px; font-size: 18px; font-weight: 700; text-shadow: 0 2px 8px #000; }
  .ps-bar { position: absolute; left: 12px; right: 12px; bottom: 14px; height: 5px; border-radius: 3px; background: #ffffff33; }
  .ps-bar i { display: block; height: 100%; border-radius: 3px; background: #ff5050; }
  .hud .mlens-t { font-size: 32px; }
  .hud .mlens-l { font-size: 26px; }
  .f-fallback { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 44px; box-sizing: border-box; border: 2px dashed #ffffff24; border-radius: 36px; background: linear-gradient(160deg, #151b24, #0b0e13); color: var(--text-dim); }
  .fb-num { color: #ffd58a; font-size: 18px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
  .fb-icon { width: 64px; height: 64px; color: #9ddcff; }
  .fb-icon svg { width: 100%; height: 100%; }
  .f-fallback b { color: #fff; font: 600 24px var(--mono); word-break: break-all; }
  .f-fallback p { margin: 0; font-size: 24px; line-height: 1.4; }
  .f-fallback .fb-meta { color: var(--text-faint); font-size: 19px; }
  .f-text .f-sub { margin-top: 22px; max-width: 860px; }
  /* the board picture is wider (1.66:1) than these boxes (1.56:1): no box background or box shadow, so nothing shows
     above and below it; the shadow follows the board itself */
  .src-frame { position: absolute; width: 360px; height: 230px; overflow: hidden; border-radius: 14px; background: transparent; filter: drop-shadow(0 18px 24px #000a); transform-origin: 50% 50%; }
  .src-frame.lifted { filter: drop-shadow(0 34px 44px #000c); }
  .src-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 14px 10px; background: linear-gradient(0deg, rgba(0, 0, 0, 0.78), transparent); font-size: 20px; font-weight: 700; }
  .src-cap i { margin-right: 6px; color: #9ddcff; font-style: normal; }
  .cutline { position: absolute; left: 0; top: 0; }
  .brackets { pointer-events: none; }
  .brackets i { position: absolute; width: 40px; height: 40px; border: 4px solid #9ddcff; }
  .brackets .tl { left: 0; top: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 10px; }
  .brackets .tr { right: 0; top: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 10px; }
  .brackets .bl { left: 0; bottom: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 10px; }
  .brackets .br { right: 0; bottom: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 10px; }
  .inst-card { border-radius: 30px; background: linear-gradient(160deg, #18202b, #0d1118); border: 1px solid var(--line); box-shadow: 0 50px 100px #000c; transform-origin: 50% 50%; }
  .inst-text { text-align: center; }
  .inst-text .eyebrow { justify-content: center; color: #9ddcff; }
  .inst-text h2 { margin: 10px 0 6px; font-size: 58px; font-weight: 600; letter-spacing: -0.03em; }
  .inst-text p { margin: 0; color: var(--text-dim); font-size: 28px; }
  .cmp-frame { overflow: hidden; border-radius: 20px; background: transparent; filter: drop-shadow(0 34px 50px #000c); transform-origin: 50% 50%; }
  .s-how .v-pass { display: flex; align-items: center; gap: 20px; color: #c9f7dd; }
  .s-how .v-pass b { font-size: 84px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; }
  .okcheck { flex: none; width: 128px; height: 128px; }
  .hero-food { filter: drop-shadow(0 40px 60px rgba(0, 0, 0, 0.6)); }
  .s-open { background: radial-gradient(ellipse at 50% 55%, #2a1c11 0%, #0b0e14 55%, #04060a 100%); } /* = .s-footage, for the match */
  .s-end { background: radial-gradient(ellipse at 66% 55%, #3a2412 0%, #120d0a 55%, #060708 100%); }
  .lock-pilot { margin: 10px 0 0; color: var(--text-dim); font-size: 26px; }
  .lock-pilot b { margin-right: 6px; color: var(--eyebrow); font-size: 18px; letter-spacing: 0.14em; text-transform: uppercase; }

  .lock-credit { margin: 14px 0 0; padding-top: 18px; border-top: 1px solid #ffffff1f; color: var(--text-faint); font-size: 21px; font-weight: 500; letter-spacing: 0.02em; }
  .lock-credit i { font-style: normal; margin: 0 4px; color: var(--text-dim); }
  /* subtitles for the chef's real voice: below the footage frame (which ends at y 990), above everything */
  .caption { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 50; opacity: 0; pointer-events: none;
    display: flex; align-items: baseline; gap: 16px; max-width: 1500px; padding: 10px 26px 12px; border-radius: 14px;
    background: rgba(4, 7, 12, 0.72); color: #fff; font-size: 38px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.25; white-space: nowrap; }
  .caption b { color: var(--eyebrow); font-size: 18px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
  .end-food { overflow: hidden; }
  .end-food-bg { background: radial-gradient(ellipse at 66% 55%, #3a2412 0%, #120d0a 55%, #060708 100%); }
  .lens-scan { opacity: 0; mix-blend-mode: screen; background: repeating-linear-gradient(0deg, rgba(200, 228, 255, 0.16) 0 2px, transparent 2px 6px); }
  .end-flare { opacity: 0; border-radius: 50%; mix-blend-mode: screen; pointer-events: none;
    background: radial-gradient(circle, rgba(255, 244, 228, 0.75) 0%, rgba(255, 206, 150, 0.32) 22%, rgba(255, 170, 110, 0.08) 45%, transparent 66%); }
  .end-streak { opacity: 0; border-radius: 50%; mix-blend-mode: screen; pointer-events: none; filter: blur(3px);
    background: linear-gradient(90deg, transparent, rgba(255, 226, 190, 0.5) 30%, rgba(255, 250, 240, 0.95) 50%, rgba(255, 226, 190, 0.5) 70%, transparent); }
  .away-tag { padding: 12px 22px; border-radius: 999px; border: 1px solid #ffffff2e; background: #000b; color: #e6edf5; font-size: 26px; font-weight: 600; text-align: center; box-sizing: border-box; }
  .s-trust .through, .s-trust { background: #07090c; }

  /* ---------- the real-footage scene ---------- */
  .s-reel { background: #07080a; }
  .ambient { position: absolute; left: -8%; top: -8%; width: 116%; height: 116%; filter: blur(70px) brightness(0.42) saturate(1.3); }
  .amb-shade { pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0.05) 30%, rgba(0, 0, 0, 0.6) 100%); }
  .vframe { overflow: hidden; border-radius: 36px; background: #000; box-shadow: 0 50px 110px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.14); }
  .vframe video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .lensbox { position: absolute; color: #fff; mix-blend-mode: screen; filter: drop-shadow(0 0 7px rgba(255, 255, 255, 0.28)); }
  .lensbox.rec { left: 7%; top: 5%; padding: 8px 14px; border-radius: 12px; background: rgba(0, 0, 0, 0.55); mix-blend-mode: normal; }
  .rec-row { font-size: 21px; font-weight: 800; letter-spacing: 0.04em; }
  .rec-row span { margin-left: 4px; font-variant-numeric: tabular-nums; }
  .rec-step { margin-top: 2px; color: #c9d3da; font-size: 17px; font-weight: 700; }
  .lensbox.toast { left: 18%; bottom: 13%; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 14px; background: #000; font-size: 21px; font-weight: 700; }
  .lensbox.toast .mi { width: 24px; height: 24px; }
  .lensbox.card { left: 33%; top: 17%; width: 62%; mix-blend-mode: normal; }
  .lenscard { width: 100%; }
  /* lens.css rounds the card with 6cqw, which on the card itself resolves against an outer container (huge here) and
     clipped the counter and the watching dot; 6% of the card's own size is the intended radius */
  .lenscard.lens { border-radius: 6%; background: rgba(0, 0, 0, 0.62); backdrop-filter: blur(6px); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12); }
  .lensbox.toast { mix-blend-mode: normal; background: rgba(0, 0, 0, 0.6); }
  .lenscard .lens-enter { animation: none; }
  .sim-tag { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px; background: linear-gradient(0deg, rgba(0, 0, 0, 0.65), transparent); color: #e6edf5; font-size: 14px; font-weight: 800; letter-spacing: 0.12em; text-align: center; text-transform: uppercase; }
  .f-num.center { text-align: center; }
  .kt.center .headline { text-align: center; }
  .proc-label { color: #e6edf5; font-size: 30px; font-weight: 600; text-align: center; }
  .proc-bar { overflow: hidden; border-radius: 4px; background: #ffffff1f; }
  .proc-bar i { display: block; height: 100%; background: linear-gradient(90deg, #9ddcff, #3d9dfc); }
  .proc-track { border-radius: 12px; background: #ffffff10; border: 1px solid #ffffff26; }
  .proc-track .beam { position: absolute; top: -12px; bottom: -12px; width: 4px; margin-left: -2px; background: #c9ecff; box-shadow: 0 0 20px #9ddcff, 0 0 50px #8b7bff; }
  .proc-track .tick { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: #ffb020; }
  .proc-track .tick b { position: absolute; top: -36px; left: -8px; color: #ffd58a; font-size: 20px; }
  .lesson { box-sizing: border-box; padding: 34px 38px 38px; border-radius: 30px; background: rgba(10, 12, 16, 0.74); border: 1px solid #ffffff22; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.55); }
  .lesson-head b { display: block; font-size: 46px; font-weight: 600; letter-spacing: -0.02em; }
  .lesson-head span { color: var(--text-dim); font-size: 24px; }
  .lesson-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 18px; margin-top: 26px; }
  .ls img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 12px; }
  .ls i { display: block; margin-top: 12px; color: #9ddcff; font-size: 15px; font-style: normal; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .ls b { display: block; margin-top: 4px; font-size: 25px; font-weight: 600; letter-spacing: -0.01em; }
  .ls p { margin: 4px 0 0; color: var(--text-dim); font-size: 18px; line-height: 1.35; }

  /* trust */
  .evidence .eyebrow { margin-bottom: 18px; }
  .ev-bar { height: 14px; margin-bottom: 22px; border-radius: 7px; background: #ffffff14; overflow: hidden; }
  .ev-bar i { display: block; height: 100%; border-radius: 7px; }
  .erow { display: flex; align-items: center; gap: 16px; padding: 12px 0; font-size: 32px; font-weight: 600; }
  .erow .ei { width: 36px; height: 36px; color: #9ddcff; }
  .erow .ei svg { width: 100%; height: 100%; }
  .erow.hidden, .erow.hidden .ei { color: #7f8a99; }
  .watching { width: auto !important; display: flex; align-items: center; gap: 14px; padding: 12px 22px; border-radius: 999px; background: #000c; border: 1px solid #ffffff22; font-size: 28px; font-weight: 700; }
  .wdot { width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 0 14px #fff; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- the chef's arrangement as a precise outline traced from each piece's own alpha, plus a faint fill -->
  <filter id="ghostline" x="-10%" y="-10%" width="120%" height="120%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="grow"/>
    <feComposite in="grow" in2="SourceAlpha" operator="out" result="ring"/>
    <feFlood flood-color="#9ddcff" result="ink"/>
    <feComposite in="ink" in2="ring" operator="in" result="line"/>
    <feFlood flood-color="#9ddcff" flood-opacity="0.12" result="tint"/>
    <feComposite in="tint" in2="SourceAlpha" operator="in" result="fill"/>
    <feMerge><feMergeNode in="fill"/><feMergeNode in="line"/></feMerge>
  </filter>
</svg>
<div id="viewport"><div id="stage" class="stage"></div></div>
<div id="controls" role="group" aria-label="Film controls">
  <button id="play" type="button" aria-label="Play">▶</button>
  <button id="replay" type="button" aria-label="Replay from the start">↺</button>
  <div class="scrub"><div class="ticks" id="ticks"></div><input id="seek" type="range" min="0" step="0.01" value="0" aria-label="Seek"></div>
  <span id="time">0:00.0 / 0:00.0</span>
  <span id="scene"></span>
  <button id="clean" type="button" title="Clean playback: hide controls (C)">Clean</button>
  <button id="fs" type="button" aria-label="Fullscreen (F)">⛶</button>
</div>
<script type="module" src="film/main.js"></script>
</body>
</html>
